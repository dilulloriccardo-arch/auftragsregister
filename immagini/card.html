<!doctype html><html lang="{lang}"><head><meta charset="utf-8"><style>
/* the share card (og-<lang>.png, 1200x630): rendered by rendi.py with the site's own fonts */
@font-face{font-family:"Libre Franklin";font-weight:400 700;src:url({fonts}/lf.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:600 800;src:url({fonts}/bg.woff2) format("woff2")}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#07090c;color:#f3f6f9;font-family:"Libre Franklin",sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(620px 480px at 6% -12%,rgba(56,181,221,.32),transparent 66%),
  radial-gradient(560px 440px at 100% -8%,rgba(124,92,255,.24),transparent 66%)}
.grid{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 72px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 72px);
  -webkit-mask-image:radial-gradient(130% 90% at 50% 0%,#000 30%,transparent 80%)}
.c{position:absolute;left:84px;right:84px;top:70px;bottom:64px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:22px}
.top img{width:68px;height:68px}
.site{font:700 32px/1.2 "Bricolage Grotesque";letter-spacing:-.02em}
h1{font:800 78px/1.02 "Bricolage Grotesque";letter-spacing:-.045em;margin:auto 0 0;max-width:1000px;text-wrap:balance}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-top:36px;padding-top:22px;
  border-top:2px solid rgba(255,255,255,.28);font:600 26px/1.2 "Libre Franklin";color:#aab7c4}
.foot b{color:#f3f6f9;font-weight:700}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="c"><div class="top"><img src="{mark}" alt=""><span class="site">{site}</span></div>
<h1>{tagline}</h1>
<div class="foot"><b>auftragsregister.ch</b><span>{words}</span></div></div></body></html>
