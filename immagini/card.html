<!doctype html><html lang="{lang}"><head><meta charset="utf-8"><style>
/* the share card (og-<lang>.png, 1200x630) in design A2 "Brass" (step 4, 15.10.2026): rendered by rendi.py with the
   site's own fonts; the brass pillars are decoration (the home's sky), not data */
@font-face{font-family:"Instrument Sans";font-weight:700;src:url({fonts}/is7.woff2) format("woff2")}
@font-face{font-family:"AR Gothic";src:url({fonts}/lg.woff2) format("woff2")}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#000;color:#f4f1ea;font-family:"Instrument Sans",sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(720px 520px at 92% 100%,rgba(201,162,78,.24),transparent 62%),
  radial-gradient(600px 420px at 0% 0%,rgba(244,241,234,.05),transparent 60%)}
.sky{position:absolute;right:84px;bottom:150px;display:flex;align-items:flex-end;gap:6px;width:300px;height:250px}
.sky i{flex:1;background:linear-gradient(180deg,rgba(246,226,166,.95),rgba(215,178,99,.7) 22%,rgba(168,128,58,.28) 66%,rgba(140,104,44,.04))}
.sky i.p{background:repeating-linear-gradient(-45deg,rgba(201,162,78,.75) 0 2px,transparent 2px 6px)}
.c{position:absolute;left:84px;right:84px;top:66px;bottom:60px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:18px}
.top img{width:58px;height:58px}
.site{font:400 38px/1 "AR Gothic";letter-spacing:.05em;text-transform:uppercase}
h1{font:400 100px/.9 "AR Gothic";letter-spacing:.012em;text-transform:uppercase;margin:auto 0 0;max-width:740px;text-wrap:balance}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-top:34px;padding-top:22px;
  border-top:1px solid rgba(201,162,78,.6);font:700 21px/1.2 "Instrument Sans";letter-spacing:.14em;text-transform:uppercase;color:#a6a39b}
.foot b{color:#f3dc9a}
</style></head><body><div class="glow"></div>
<div class="sky"><i class="p" style="height:6%"></i><i class="p" style="height:14%"></i><i style="height:46%"></i><i style="height:50%"></i><i style="height:57%"></i><i style="height:62%"></i><i style="height:55%"></i><i style="height:66%"></i><i style="height:72%"></i><i style="height:69%"></i><i style="height:79%"></i><i style="height:74%"></i><i style="height:100%"></i><i class="p" style="height:41%"></i></div>
<div class="c"><div class="top"><img src="{mark}" alt=""><span class="site">{site}</span></div>
<h1>{tagline}</h1>
<div class="foot"><b>auftragsregister.ch</b><span>{words}</span></div></div></body></html>
